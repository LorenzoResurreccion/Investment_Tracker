# Test configuration — overrides main application.properties for unit tests.
# Provides dummy values for Cognito properties so the Spring context loads without real AWS env vars.

AWS_REGION=us-east-1
COGNITO_USER_POOL_ID=us-east-1_TestPool

# Disable the startup environment validator in tests
spring.main.allow-bean-definition-overriding=true

# Finnhub — disabled in tests
finnhub.api.key=test-key
finnhub.enabled=false

# Frontend origin
app.frontend-origin=http://localhost:5173
