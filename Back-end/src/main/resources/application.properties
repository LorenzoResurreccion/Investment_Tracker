# Server
server.port=${SERVER_PORT:8080}
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
spring.threads.virtual.enabled=true

# Finnhub API key (required — validated by StartupEnvironmentValidator; default empty to allow validator to run)
finnhub.api.key=${FINNHUB_API_KEY:}
finnhub.enabled=${FINNHUB_ENABLED:true}

# DataSource (validated by StartupEnvironmentValidator)
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true

# CORS — front-end origin
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# OAuth2 Resource Server — AWS Cognito JWT validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${AWS_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://cognito-idp.${AWS_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}/.well-known/jwks.json

# AWS Bedrock — AI insights
app.bedrock.model-id=${BEDROCK_MODEL_ID:us.anthropic.claude-haiku-4-5-20251001-v1:0}
app.bedrock.region=${BEDROCK_REGION:us-east-1}
