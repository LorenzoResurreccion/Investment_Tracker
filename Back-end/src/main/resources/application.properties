# Server
server.port=${SERVER_PORT:8080}
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
spring.threads.virtual.enabled=true

# Finnhub API key (required — validated by StartupEnvironmentValidator; default empty to allow validator to run)
finnhub.api.key=${FINNHUB_API_KEY:}
finnhub.enabled=${FINNHUB_ENABLED:true}

# DataSource (validated by StartupEnvironmentValidator)
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true

# CORS — front-end origin
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
